<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생활 속 동식물 자원 분류 게임</title>
  <style>
    :root {
      --bg: #fbf7ed;
      --ink: #1f2d25;
      --muted: #617166;
      --green: #2f7a4f;
      --green-2: #e6f3e9;
      --yellow: #f6bd4a;
      --orange: #ea7a45;
      --blue: #3c7ec3;
      --red: #d9514e;
      --line: #d8c8a8;
      --white: #fffef9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(246, 189, 74, .26), transparent 28rem),
        radial-gradient(circle at 93% 15%, rgba(80, 160, 109, .18), transparent 24rem),
        var(--bg);
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.45;
    }

    .teacher-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tool-button,
    .tab-button {
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--white);
      border: 2px solid var(--line);
      font-weight: 800;
    }

    .tool-button:active,
    .tab-button:active,
    .category:active,
    .next-button:active {
      transform: translateY(1px);
    }

    .panel {
      background: rgba(255, 254, 249, .92);
      border: 2px solid rgba(216, 200, 168, .9);
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(58, 41, 20, .08);
    }

    .setup {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px;
      margin-bottom: 14px;
    }

    .score {
      min-width: 146px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #27382e;
      color: #fff;
      text-align: center;
    }

    .score strong {
      display: block;
      font-size: 14px;
      opacity: .82;
    }

    .score span {
      display: block;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-button {
      min-height: 58px;
      font-size: clamp(16px, 2vw, 22px);
    }

    .tab-button.active {
      color: #fff;
      background: #2e6f73;
      border-color: #2e6f73;
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 390px) 1fr;
      gap: 14px;
    }

    .card-zone {
      padding: 18px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .round {
      color: var(--muted);
      font-weight: 800;
      font-size: 16px;
    }

    .resource-card {
      min-height: 270px;
      display: grid;
      align-content: center;
      gap: 14px;
      padding: 24px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, #2f7a4f, #3c7ec3);
      box-shadow: inset 0 -18px 60px rgba(0, 0, 0, .12);
      text-align: center;
    }

    .resource-card .label {
      font-size: 15px;
      font-weight: 900;
      opacity: .82;
    }

    .resource-card .name {
      font-size: clamp(40px, 7vw, 66px);
      font-weight: 900;
      line-height: 1.05;
      word-break: keep-all;
    }

    .resource-card .hint {
      max-width: 28ch;
      margin: 0 auto;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.45;
      opacity: .95;
      word-break: keep-all;
    }

    .next-button {
      min-height: 58px;
      border-radius: 10px;
      color: #fff;
      background: var(--orange);
      font-size: 20px;
      font-weight: 900;
    }

    .categories {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .category {
      min-height: 150px;
      padding: 16px;
      border-radius: 12px;
      border: 3px solid transparent;
      background: var(--white);
      text-align: left;
      box-shadow: 0 8px 18px rgba(69, 48, 20, .07);
    }

    .category h2 {
      margin: 0 0 8px;
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.1;
    }

    .category p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 17px);
      line-height: 1.45;
      word-break: keep-all;
    }

    .category.correct {
      border-color: #2f9e44;
      background: #e6f7ea;
    }

    .category.wrong {
      border-color: #d9514e;
      background: #fff0ee;
    }

    .feedback {
      grid-column: 1 / -1;
      min-height: 70px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #27382e;
      color: #fff;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.45;
    }

    .feedback strong {
      color: #ffdf7e;
    }

    .examples {
      margin-top: 14px;
      padding: 14px;
    }

    .examples h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .example-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      font-size: 14px;
    }

    .example-box {
      min-height: 94px;
      padding: 10px;
      border-radius: 8px;
      background: #f7f0e2;
      line-height: 1.5;
    }

    .example-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .hidden { display: none; }

    @media (max-width: 820px) {
      .app { padding: 14px; }
      header,
      .setup,
      main {
        grid-template-columns: 1fr;
      }
      .teacher-tools {
        justify-content: flex-start;
      }
      .score {
        min-width: 0;
      }
      .categories {
        grid-template-columns: 1fr;
      }
      .category {
        min-height: 116px;
      }
      .example-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>생활 속 동식물 자원 분류 게임</h1>
        <div class="subtitle">교과서를 읽은 뒤, 모둠별로 카드를 보고 알맞은 분류를 선택하세요.</div>
      </div>
      <div class="teacher-tools">
        <button class="tool-button" id="shuffleButton" type="button">카드 섞기</button>
        <button class="tool-button" id="resetButton" type="button">점수 초기화</button>
      </div>
    </header>

    <section class="setup panel" aria-label="모둠 선택과 점수">
      <div>
        <strong>개인 태블릿 활동</strong>
        <div class="subtitle">문제를 풀고, 점수와 분류 결과를 학습지에 기록하세요.</div>
      </div>
      <div class="score">
        <strong id="scoreTeam">내 점수</strong>
        <span id="scoreValue">0</span>
      </div>
    </section>

    <nav class="tabs" aria-label="게임 선택">
      <button class="tab-button active" id="gameOneButton" type="button">1게임: 활용 자원 분류</button>
      <button class="tab-button" id="gameTwoButton" type="button">2게임: 목적별 자원 분류</button>
    </nav>

    <main>
      <section class="card-zone panel" aria-label="문제 카드">
        <div class="round" id="roundText">1 / 1</div>
        <article class="resource-card" id="resourceCard">
          <div class="label" id="cardLabel">생활 속 물건</div>
          <div class="name" id="cardName">벼</div>
          <div class="hint" id="cardHint">밥과 떡을 만들 수 있어요.</div>
        </article>
        <button class="next-button" id="nextButton" type="button">다음 카드</button>
      </section>

      <section class="categories panel" id="categoryList" aria-label="분류 선택"></section>
    </main>

    <section class="examples panel">
      <h2 id="exampleTitle">예시 확인</h2>
      <div class="example-grid" id="exampleGrid"></div>
    </section>
  </div>

  <script>
    let score = 0;
    let currentGame = "use";
    let currentIndex = 0;
    let answered = false;

    const categories = {
      use: [
        { id: "식량 자원", desc: "사람이나 동물의 먹을거리로 활용됩니다." },
        { id: "제품 재료", desc: "옷, 종이, 가구, 약, 생활용품 등의 재료가 됩니다." },
        { id: "사회 자원", desc: "사람에게 정서적 안정감이나 도움을 줍니다." },
        { id: "생태 자원", desc: "환경을 깨끗하게 만들거나 생태계를 유지하는 데 도움을 줍니다." }
      ],
      purpose: [
        { id: "경제 동물", desc: "생활에 필요한 물질이나 경제적 이익을 얻기 위해 기릅니다." },
        { id: "봉사 동물", desc: "특수한 목적에 따라 훈련되어 사람을 돕습니다." },
        { id: "식량 작물", desc: "식량으로 이용하기 위해 기릅니다." },
        { id: "원예 작물", desc: "보고 즐기거나 생활 공간을 아름답게 하기 위해 기릅니다." },
        { id: "특용 작물", desc: "차, 약, 섬유, 기름 등 특별한 용도로 이용하기 위해 기릅니다." }
      ]
    };

    const games = {
      use: [
        { name: "밥", label: "생활 속 물건", hint: "벼에서 얻은 쌀로 만들어요.", answers: ["식량 자원"], why: "밥은 우리가 먹는 음식이므로 식량 자원입니다." },
        { name: "우유", label: "생활 속 물건", hint: "젖소에게서 얻어요.", answers: ["식량 자원"], why: "우유는 먹을거리이므로 식량 자원입니다." },
        { name: "달걀", label: "생활 속 물건", hint: "닭에게서 얻을 수 있어요.", answers: ["식량 자원"], why: "달걀은 음식으로 먹으므로 식량 자원입니다." },
        { name: "꿀", label: "생활 속 물건", hint: "꿀벌이 꽃에서 모아 만들어요.", answers: ["식량 자원"], why: "꿀은 먹을거리로 활용되므로 식량 자원입니다." },
        { name: "고구마", label: "생활 속 자원", hint: "밭에서 기르는 작물이에요.", answers: ["식량 자원"], why: "고구마는 먹을 수 있는 작물이므로 식량 자원입니다." },
        { name: "옥수수", label: "생활 속 자원", hint: "사람과 동물의 먹이로 쓰여요.", answers: ["식량 자원"], why: "옥수수는 먹을거리로 쓰이므로 식량 자원입니다." },
        { name: "면 티셔츠", label: "생활 속 물건", hint: "목화에서 얻은 섬유로 만들어요.", answers: ["제품 재료"], why: "목화는 옷을 만드는 재료가 되므로 제품 재료입니다." },
        { name: "종이", label: "생활 속 물건", hint: "나무에서 얻은 펄프로 만들어요.", answers: ["제품 재료"], why: "나무는 종이를 만드는 재료가 되므로 제품 재료입니다." },
        { name: "가죽 지갑", label: "생활 속 물건", hint: "동물의 가죽을 가공해 만들어요.", answers: ["제품 재료"], why: "동물의 가죽은 생활용품의 재료가 되므로 제품 재료입니다." },
        { name: "비단", label: "생활 속 물건", hint: "누에고치에서 얻은 실로 만들어요.", answers: ["제품 재료"], why: "누에는 비단을 만드는 재료를 제공하므로 제품 재료입니다." },
        { name: "참기름", label: "생활 속 물건", hint: "참깨를 짜서 만들어요.", answers: ["제품 재료", "식량 자원"], why: "참깨는 기름을 만드는 재료이고, 먹는 데도 쓰입니다." },
        { name: "안내견", label: "생활 속 동물", hint: "앞을 보기 어려운 사람의 이동을 도와요.", answers: ["사회 자원"], why: "안내견은 사람을 도와 생활을 편리하게 하므로 사회 자원입니다." },
        { name: "구조견", label: "생활 속 동물", hint: "위험한 곳에서 사람을 찾도록 훈련받아요.", answers: ["사회 자원"], why: "구조견은 사람의 안전을 돕기 때문에 사회 자원입니다." },
        { name: "경찰견", label: "생활 속 동물", hint: "범죄 예방과 수색을 도와요.", answers: ["사회 자원"], why: "경찰견은 사회의 안전을 돕는 자원입니다." },
        { name: "치료견", label: "생활 속 동물", hint: "사람의 마음 안정과 치료 활동을 도와요.", answers: ["사회 자원"], why: "치료견은 정서적 안정감을 주므로 사회 자원입니다." },
        { name: "반려동물", label: "생활 속 동물", hint: "함께 지내며 즐거움과 안정감을 줘요.", answers: ["사회 자원"], why: "반려동물은 정서적 안정감을 주므로 사회 자원입니다." },
        { name: "꿀벌", label: "생활 속 동물", hint: "꽃가루받이를 도와 열매가 맺히게 해요.", answers: ["생태 자원", "식량 자원"], why: "꿀벌은 꽃가루받이를 도와 생태계를 유지하고, 꿀도 제공합니다." },
        { name: "가로수", label: "생활 속 식물", hint: "공기를 맑게 하고 그늘을 만들어요.", answers: ["생태 자원"], why: "가로수는 쾌적한 환경을 만드는 데 도움을 주므로 생태 자원입니다." },
        { name: "숲", label: "생활 속 식물", hint: "동식물의 보금자리이자 깨끗한 공기를 만들어요.", answers: ["생태 자원"], why: "숲은 생물의 서식지와 깨끗한 환경을 제공합니다." },
        { name: "지렁이", label: "생활 속 동물", hint: "흙을 부드럽고 건강하게 만들어요.", answers: ["생태 자원"], why: "지렁이는 흙을 건강하게 만들어 생태계에 도움을 줍니다." }
      ],
      purpose: [
        { name: "소", label: "동물 자원", hint: "고기, 우유, 가죽 등을 얻을 수 있어요.", answers: ["경제 동물"], why: "소는 생활에 필요한 물질과 경제적 이익을 주므로 경제 동물입니다." },
        { name: "돼지", label: "동물 자원", hint: "고기를 얻기 위해 기르기도 해요.", answers: ["경제 동물"], why: "돼지는 식량을 얻기 위해 기르는 경제 동물입니다." },
        { name: "닭", label: "동물 자원", hint: "고기와 달걀을 얻을 수 있어요.", answers: ["경제 동물"], why: "닭은 고기와 달걀을 제공하는 경제 동물입니다." },
        { name: "양", label: "동물 자원", hint: "털과 고기를 얻을 수 있어요.", answers: ["경제 동물"], why: "양은 털과 고기 등을 제공하므로 경제 동물입니다." },
        { name: "꿀벌", label: "동물 자원", hint: "꿀을 얻고 꽃가루받이에도 도움을 줘요.", answers: ["경제 동물"], why: "꿀벌은 꿀 등 경제적 이익을 주므로 경제 동물로 볼 수 있습니다." },
        { name: "안내견", label: "동물 자원", hint: "앞을 보기 어려운 사람의 이동을 도와요.", answers: ["봉사 동물"], why: "안내견은 특수한 목적에 맞게 훈련되어 사람을 돕는 봉사 동물입니다." },
        { name: "구조견", label: "동물 자원", hint: "사람을 찾거나 구조 활동을 도와요.", answers: ["봉사 동물"], why: "구조견은 구조 활동을 위해 훈련된 봉사 동물입니다." },
        { name: "경찰견", label: "동물 자원", hint: "수색이나 치안 활동을 도와요.", answers: ["봉사 동물"], why: "경찰견은 경찰 활동을 돕기 위해 훈련된 봉사 동물입니다." },
        { name: "탐지견", label: "동물 자원", hint: "냄새를 맡아 위험 물질 등을 찾아요.", answers: ["봉사 동물"], why: "탐지견은 특수한 목적을 위해 훈련된 봉사 동물입니다." },
        { name: "치료견", label: "동물 자원", hint: "사람의 정서 안정과 치료 활동을 도와요.", answers: ["봉사 동물"], why: "치료견은 사람을 돕도록 훈련된 봉사 동물입니다." },

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function currentCards() {
      return games[currentGame];
    }

    function renderScore() {
      document.getElementById("scoreValue").textContent = score;
    }

    function renderCategories() {
      const list = document.getElementById("categoryList");
      list.innerHTML = "";
      categories[currentGame].forEach((category) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category";
        button.dataset.answer = category.id;
        button.innerHTML = `<h2>${category.id}</h2><p>${category.desc}</p>`;
        button.addEventListener("click", () => chooseAnswer(category.id, button));
        list.appendChild(button);
      });
      const feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.id = "feedback";
      feedback.textContent = "카드를 보고 알맞은 분류를 선택하세요.";
      list.appendChild(feedback);
    }

    function renderExamples() {
      const title = document.getElementById("exampleTitle");
      const grid = document.getElementById("exampleGrid");
      title.textContent = currentGame === "use" ? "1게임 예시" : "2게임 예시";
      grid.innerHTML = categories[currentGame].map((category) => {
        const items = games[currentGame]
          .filter((card) => card.answers.includes(category.id))
          .slice(0, 6)
          .map((card) => card.name)
          .join(", ");
        return `<div class="example-box"><strong>${category.id}</strong>${items}</div>`;
      }).join("");
    }

    function renderCard() {
      const cards = currentCards();
      const card = cards[currentIndex];
      answered = false;
      document.getElementById("roundText").textContent = `${currentIndex + 1} / ${cards.length}`;
      document.getElementById("cardLabel").textContent = card.label;
      document.getElementById("cardName").textContent = card.name;
      document.getElementById("cardHint").textContent = card.hint;
      document.querySelectorAll(".category").forEach((button) => {
        button.classList.remove("correct", "wrong");
        button.disabled = false;
      });
      document.getElementById("feedback").textContent = "카드를 보고 알맞은 분류를 선택하세요.";
    }

    function chooseAnswer(answer, button) {
      if (answered) return;
      const card = currentCards()[currentIndex];
      const isCorrect = card.answers.includes(answer);
      answered = true;
      document.querySelectorAll(".category").forEach((categoryButton) => {
        categoryButton.disabled = true;
        if (card.answers.includes(categoryButton.dataset.answer)) {
          categoryButton.classList.add("correct");
        }
      });
      if (isCorrect) {
        score += 10;
        document.getElementById("feedback").innerHTML = `<strong>정답!</strong> ${card.why}`;
      } else {
        button.classList.add("wrong");
        document.getElementById("feedback").innerHTML = `<strong>아쉬워요.</strong> 정답은 ${card.answers.join(", ")}입니다. ${card.why}`;
      }
      renderScore();
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % currentCards().length;
      renderCard();
    }

    function switchGame(game) {
      currentGame = game;
      currentIndex = 0;
      document.getElementById("gameOneButton").classList.toggle("active", game === "use");
      document.getElementById("gameTwoButton").classList.toggle("active", game === "purpose");
      renderCategories();
      renderExamples();
      renderCard();
    }

    document.getElementById("nextButton").addEventListener("click", nextCard);
    document.getElementById("gameOneButton").addEventListener("click", () => switchGame("use"));
    document.getElementById("gameTwoButton").addEventListener("click", () => switchGame("purpose"));
    document.getElementById("shuffleButton").addEventListener("click", () => {
      shuffle(currentCards());
      currentIndex = 0;
      renderCard();
    });
    document.getElementById("resetButton").addEventListener("click", () => {
      score = 0;
      renderScore();
    });

    shuffle(games.use);
    shuffle(games.purpose);
    renderScore();
    renderCategories();
    renderExamples();
    renderCard();
  </script>
